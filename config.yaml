# config.yaml — edit paths before running data scripts on Colab

data:
  maestro_csv: "/content/maestro-v3.0.0/maestro-v3.0.0.csv"
  maestro_midi_dir: "/content/maestro-v3.0.0/"
  output_dir: "/content/thesis_data"
  window_sec: 15
  max_windows_per_perf: 5
  max_perfs_per_work: 2
  random_seed: 42

model:
  name: "stanford-crfm/music-medium-800k"
  dtype: "float16"

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["c_attn", "c_proj", "c_fc"]
  fan_in_fan_out: true

training:
  seq_len: 1024
  micro_batch: 2
  grad_accum: 8
  lr: 2.0e-4
  warmup_steps: 15
  max_steps: 200
  save_every: 50
  random_seed: 42
  max_train_windows_per_style: 600
  # New experiments never reuse the historical adapter directories.
  experiment_name: "neural_alignment_v1"
  anticipatory_prob: 0.5
  context_groups: 170
  invalid_window_policy: "fail-on-any-window-error-empty-or-all-masked-v1"
  # Null evaluates every deterministic validation example.
  validation_max_examples: null
  drive_dir: "/content/drive/MyDrive/thesis_adapters"

generation:
  top_p: 0.95
  # Maximum sampled event groups per melody; exhaustion is a logged failure.
  max_events: 100000
  # max_new_tokens: not currently used by generate.py (end_time controls length)
  max_new_tokens: 1024
  random_seed: 42
  n_test_melodies: 30
  # New generation outputs are isolated from historical result files.
  output_dir: "results/neural_alignment_v1"

evaluation:
  results_dir: "results"
  # Null evaluates every held-out manifest window in NLL diagnostics.
  nll_test_max_windows: null
  bootstrap_n: 1000
  classifier_C: 1.0

rendering:
  backend: "fluidsynth"
  soundfont_path: null
  sample_rate: 44100
  # Explicitly opt in to labeled *_balanced.wav derivatives.
  balance_melody_accompaniment: false
  melody_velocity: 80
  accompaniment_gain: 0.55
  onset_tolerance_sec: 0.03
  duration_tolerance_sec: 0.05
